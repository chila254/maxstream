name: Build MaxStream (Mobile + TV)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mobile:
    name: Flutter Mobile APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks

      - name: Decode Google Services
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -di > android/app/google-services.json

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storeFile=../app/key.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> android/keystore.properties

      - name: Validate signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Mobile APK
        run: flutter build apk --release

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-mobile.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-tv:
    name: Kotlin TV APK (FossUniversalRelease)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create local.properties
        run: |
          FLUTTER_PATH=$(which flutter | sed 's|/bin/flutter||')
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/key.jks

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storeFile=../app/key.jks" > android/keystore.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> android/keystore.properties
          echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> android/keystore.properties

      - name: Validate signing config
        if: env.KEYSTORE_BASE64 != ''
        run: |
          keytool -list -keystore android/app/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-tv-${{ hashFiles('android/**/*.gradle*', 'android/**/libs.versions.toml') }}

      - name: Compile Kotlin (Foss / Universal) — ./gradlew compileFossUniversalReleaseKotlin
        run: cd android && ./gradlew compileFossUniversalReleaseKotlin --no-daemon

      - name: Assemble release APK
        run: cd android && ./gradlew assembleFossUniversalRelease --no-daemon

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: maxstream-tv.apk
          path: android/tvapp/build/outputs/apk/**/*.apk
          retention-days: 7
