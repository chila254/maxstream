name: maxstream
description: A new Flutter project.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  better_player: ^0.0.84
  webview_flutter: ^4.4.4
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  cached_network_image: ^3.2.3
  provider: ^6.0.5
  logger: ^2.0.2
  youtube_player_flutter: ^9.1.1 
  sqflite: ^2.3.2
  path: ^1.8.3
  android_intent_plus: ^6.0.0
  url_launcher: ^6.2.6
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.2
  google_sign_in: ^6.3.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  lottie: ^3.1.0
  path_provider: ^2.1.1
  flutter_local_notifications: ^19.4.2
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  installed_apps: ^2.0.0
  html: ^0.15.4
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  open_file: ^3.3.2
  image_picker: ^1.0.8

dev_dependencies:
  flutter_test:

    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/movies.json
    - assets/images/background.jpg
    - assets/images/maxstream_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/maxstream_logo.png

flutter_native_splash:
  color: "#000000"
  image: assets/images/maxstream_logo.png
  android: true
  ios: true
  fullscreen: true
